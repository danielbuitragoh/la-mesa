<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Mesa · Panel de administración</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Sin esto, window.supabase nunca existe y escucharPedidos() se corta en su
     primera línea: el login y el listado por REST funcionan igual, pero
     Realtime jamás llega a intentar conectarse. Faltaba, no estaba comentada. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* =====================================================================
   LA MESA · Panel de administración
   Mismo design system que la app. Adaptado a cocina: tipos más grandes,
   contraste alto y botones que se aciertan con las manos ocupadas.
   ===================================================================== */
:root{
  --naranja:#F26B1F; --naranja-icono:#F2681F;
  --amarillo:#F9C65C; --marfil:#FFF6ED; --carbon:#1F1F1F; --teal:#2EBC83;
  /* Variantes solo para texto: la marca no pasa AA en letra pequeña */
  --naranja-texto:#B8480A; --teal-texto:#1C7A54; --rojo-texto:#D23232;
  --crema:#FBEEE1; --rojo:#D64545;
  --linea:rgba(31,31,31,.10);
  --tinta-60:rgba(31,31,31,.66); --tinta-40:rgba(31,31,31,.42);
  --display:'Canela','Instrument Serif',Georgia,serif;
  --cuerpo:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --e1:4px; --e2:8px; --e3:12px; --e4:16px; --e5:24px; --e6:32px; --e7:40px; --e8:48px;
  --r1:4px; --r2:8px; --r3:12px; --r4:16px;
  --s-suave:0 4px 12px rgba(0,0,0,.06);
  --s-media:0 10px 24px rgba(0,0,0,.08);
  --s-fuerte:0 20px 40px rgba(0,0,0,.12);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--cuerpo);background:var(--marfil);color:var(--carbon);
  height:100vh;overflow:hidden;display:flex;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
svg{display:block}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(31,31,31,.14);border-radius:4px}

.h1{font-family:var(--display);font-size:38px;line-height:1.1}
.h2{font-family:var(--display);font-size:28px;line-height:1.15}
.h3{font-size:18px;font-weight:600}
.b1{font-size:14px;line-height:1.5} .b2{font-size:12.5px;line-height:1.5}
.cap{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.muted{color:var(--tinta-60)} .faint{color:var(--tinta-60)}

/* ---------- Barra lateral ---------- */
.lateral{width:236px;flex:none;background:var(--carbon);color:var(--marfil);
  display:flex;flex-direction:column;padding:var(--e5) var(--e4)}
.lateral .marca{display:flex;align-items:center;gap:7px;padding:0 var(--e2) var(--e6)}
.nav{display:flex;flex-direction:column;gap:var(--e1)}
.nav button{display:flex;align-items:center;gap:var(--e3);height:46px;padding:0 var(--e3);
  border-radius:var(--r3);font-size:14px;font-weight:500;color:rgba(255,246,237,.62);
  transition:background .16s,color .16s;position:relative}
.nav button:hover{background:rgba(255,255,255,.06);color:var(--marfil)}
.nav button.on{background:var(--naranja);color:#fff;font-weight:600}
.nav .globo{margin-left:auto;min-width:22px;height:22px;padding:0 6px;border-radius:11px;
  background:var(--naranja);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center}
.nav button.on .globo{background:rgba(0,0,0,.24)}
.lateral .pie{margin-top:auto;padding-top:var(--e5);border-top:1px solid rgba(255,255,255,.1)}

.interruptor{display:flex;align-items:center;gap:var(--e3);padding:var(--e3);border-radius:var(--r3);
  background:rgba(255,255,255,.06);margin-bottom:var(--e2);width:100%}
.palanca{width:40px;height:23px;border-radius:12px;background:rgba(255,255,255,.2);position:relative;flex:none;transition:.2s}
.palanca::after{content:'';position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;
  background:#fff;transition:.2s cubic-bezier(.3,.9,.3,1)}
.palanca.on{background:var(--teal)}
.palanca.on::after{transform:translateX(17px)}

/* ---------- Zona principal ---------- */
.principal{flex:1;display:flex;flex-direction:column;min-width:0}
.encabezado{padding:var(--e5) var(--e6) var(--e4);display:flex;align-items:flex-end;gap:var(--e4);
  border-bottom:1px solid var(--linea)}
.encabezado .sub{font-size:13px;color:var(--tinta-60);margin-top:3px}
.contenido{flex:1;overflow-y:auto;padding:var(--e5) var(--e6) var(--e8)}

/* ---------- Botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--e2);height:42px;
  padding:0 var(--e4);border-radius:var(--r3);font-size:13.5px;font-weight:600;transition:.16s}
.btn:active{transform:scale(.975)}
.btn-primario{background:var(--naranja);color:#fff;box-shadow:var(--s-suave)}
.btn-primario:hover{background:#E15E15}
.btn-secundario{background:var(--crema)}
.btn-secundario:hover{background:#F4E0CD}
.btn-oscuro{background:var(--carbon);color:var(--marfil)}
.btn-linea{border:1.5px solid var(--linea)}
.btn-linea:hover{border-color:var(--naranja);color:var(--naranja-texto)}
.btn-sm{height:34px;padding:0 var(--e3);font-size:12.5px}

/* ---------- Tablero de pedidos ---------- */
.carriles{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:var(--e4);
  height:100%;align-items:start}
.carril{display:flex;flex-direction:column;min-height:0;height:100%}
.carril-enc{display:flex;align-items:center;gap:var(--e2);padding:0 var(--e1) var(--e3);position:sticky;top:0;
  background:var(--marfil);z-index:2}
.carril-enc .pip{width:9px;height:9px;border-radius:50%;flex:none}
.carril-enc h3{font-size:13.5px;font-weight:700}
.carril-enc .n{margin-left:auto;font-size:12px;font-weight:700;color:var(--tinta-40);
  background:var(--crema);border-radius:10px;padding:2px 9px}
.carril-cuerpo{display:flex;flex-direction:column;gap:var(--e3);overflow-y:auto;padding:2px}

.pedido{background:#fff;border-radius:var(--r4);padding:var(--e4);box-shadow:var(--s-suave);
  border-left:4px solid transparent;transition:box-shadow .2s, transform .2s}
.pedido:hover{box-shadow:var(--s-media)}
.pedido.nuevo{animation:entra .5s cubic-bezier(.2,.9,.3,1) both, destello 1.6s ease 2}
@keyframes entra{from{opacity:0;transform:translateY(-10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes destello{0%,100%{box-shadow:var(--s-suave)}50%{box-shadow:0 0 0 4px rgba(242,107,31,.28)}}
.pedido .fila1{display:flex;align-items:center;gap:var(--e2);margin-bottom:var(--e2)}
.pedido .num{font-family:var(--display);font-size:24px;line-height:1}
.pedido .modo{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;border-radius:10px}
.modo-recoger{background:var(--crema);color:var(--carbon)}
.modo-domicilio{background:var(--carbon);color:var(--marfil)}
.pedido .reloj{margin-left:auto;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;
  padding:3px 8px;border-radius:9px;background:var(--crema);color:var(--tinta-60)}
.pedido .reloj.tibio{background:#FDF0D6;color:#9A6B12}
.pedido .reloj.tarde{background:#FBE0E0;color:var(--rojo-texto)}
.pedido .quien{font-size:13px;font-weight:600;margin-bottom:var(--e3)}
.pedido ul{list-style:none;border-top:1px solid var(--linea);padding-top:var(--e3);margin-bottom:var(--e3)}
.pedido li{display:flex;gap:var(--e2);font-size:13px;padding:3px 0;line-height:1.4}
.pedido li .q{font-weight:700;color:var(--naranja-texto);flex:none;min-width:18px}
.pedido li .op{display:block;font-size:11.5px;color:var(--tinta-40)}
.pedido .nota{background:#FDF6E4;border-radius:var(--r2);padding:8px 10px;font-size:12px;
  color:#8A6410;margin-bottom:var(--e3);line-height:1.4}
.pedido .pie{display:flex;align-items:center;gap:var(--e3);flex-wrap:wrap;
  border-top:1px solid var(--linea);padding-top:var(--e3)}
.pedido .pie .btn{flex:1 1 auto;min-width:150px;white-space:nowrap}
.pedido .total{font-size:15px;font-weight:700}
.pedido .pago{font-size:11px;color:var(--tinta-40)}
.pedido .pago b{color:var(--teal-texto)}
.pedido .pago b.deb{color:var(--rojo-texto)}

.vacio-carril{border:1.5px dashed var(--linea);border-radius:var(--r4);padding:var(--e6) var(--e3);
  text-align:center;font-size:12.5px;color:var(--tinta-40);line-height:1.5}

/* ---------- Tabla de menú ---------- */
.tabla{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--r4);overflow:hidden;
  box-shadow:var(--s-suave)}
.tabla th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--tinta-40);padding:var(--e3) var(--e4);border-bottom:1px solid var(--linea);background:#FDFAF6}
.tabla td{padding:var(--e3) var(--e4);border-bottom:1px solid var(--linea);font-size:13.5px;vertical-align:middle}
.tabla tr:last-child td{border-bottom:0}
.tabla tr.off td{opacity:.45}
.mini{width:44px;height:44px;border-radius:var(--r2);flex:none;position:relative;overflow:hidden;
  display:block;cursor:pointer;transition:transform .16s ease, box-shadow .16s ease}
.mini.vacia::after{content:'';position:absolute;left:50%;top:50%;width:54%;padding-top:54%;
  transform:translate(-50%,-50%);border:3px solid rgba(255,255,255,.36);border-radius:50%}
.mini:hover{transform:scale(1.06);box-shadow:var(--s-media)}
.mini .lupa{position:absolute;inset:0;background:rgba(31,31,31,.55);display:grid;place-items:center;
  opacity:0;transition:opacity .16s ease}
.mini:hover .lupa{opacity:1}
.mini img{width:100%;height:100%;object-fit:cover;display:block}

/* ---------- Editor de foto ---------- */
.soltar{border:2px dashed var(--linea);border-radius:var(--r4);padding:var(--e7) var(--e5);text-align:center;
  transition:.18s;cursor:pointer;background:#fff}
.soltar:hover,.soltar.encima{border-color:var(--naranja);background:rgba(242,107,31,.05)}
.soltar .aro{width:56px;height:56px;border:4px solid rgba(242,107,31,.22);border-radius:50%;margin:0 auto var(--e3)}

.marco{position:relative;overflow:hidden;background:var(--crema)}
.marco img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.marco-tarjeta{height:170px;border-radius:var(--r4);cursor:grab;touch-action:none}
.marco-tarjeta:active{cursor:grabbing}
.marco-tarjeta .guia{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to right,transparent 32%,rgba(255,255,255,.28) 32%,rgba(255,255,255,.28) 33%,
    transparent 33%,transparent 66%,rgba(255,255,255,.28) 66%,rgba(255,255,255,.28) 67%,transparent 67%),
    linear-gradient(to bottom,transparent 32%,rgba(255,255,255,.28) 32%,rgba(255,255,255,.28) 33%,
    transparent 33%,transparent 66%,rgba(255,255,255,.28) 66%,rgba(255,255,255,.28) 67%,transparent 67%);
  opacity:0;transition:opacity .2s}
.marco-tarjeta:hover .guia{opacity:1}
.marco-chip{width:64px;height:64px;border-radius:var(--r3);flex:none}
.marco-redondo{width:56px;height:56px;border-radius:50%;flex:none}

.deslizador{width:100%;height:4px;border-radius:2px;background:var(--crema);appearance:none;outline:0}
.deslizador::-webkit-slider-thumb{appearance:none;width:20px;height:20px;border-radius:50%;
  background:var(--naranja);box-shadow:var(--s-suave);cursor:pointer}
.deslizador::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:var(--naranja);cursor:pointer}
.f-hamburguesas{background:linear-gradient(150deg,#F9C65C,#F26B1F 88%)}
.f-parrilla{background:linear-gradient(150deg,#F26B1F,#1F1F1F 96%)}
.f-bowls{background:linear-gradient(150deg,#8FE0BE,#2EBC83 90%)}
.f-bebidas{background:linear-gradient(150deg,#FFF6ED,#F9C65C 92%)}
.f-postres{background:linear-gradient(150deg,#FBEEE1,#F26B1F 108%)}

.editable{border:1.5px solid transparent;border-radius:var(--r2);padding:6px 9px;width:100%;
  background:transparent;transition:.15s;font-size:13.5px}
.editable:hover{background:var(--crema)}
.editable:focus{outline:0;background:#fff;border-color:var(--naranja);box-shadow:0 0 0 3px rgba(242,107,31,.12)}
.editable.precio{font-weight:700;font-variant-numeric:tabular-nums;max-width:120px}

.badge{display:inline-flex;align-items:center;height:21px;padding:0 9px;border-radius:11px;
  font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.badge-app{background:var(--naranja);color:#fff}
.badge-nuevo{background:var(--amarillo);color:var(--carbon)}
.badge-popular{background:var(--carbon);color:#fff}
.badge-off{background:var(--teal);color:var(--carbon)}
.badge-agotado{background:#EDE6DE;color:var(--tinta-40)}

/* ---------- Cupones ---------- */
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--e4)}
.cupon{background:#fff;border-radius:var(--r4);overflow:hidden;box-shadow:var(--s-suave);display:flex;flex-direction:column}
.cupon .cabeza{padding:var(--e5);color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#F26B1F,#C9490F)}
.cupon.apagado .cabeza{background:linear-gradient(135deg,#BDB3A9,#8D857D)}
.cupon .cabeza::after{content:'';position:absolute;right:-46px;top:-40px;width:150px;height:150px;
  border:20px solid rgba(255,255,255,.14);border-radius:50%}
.cupon h4{font-family:var(--display);font-size:24px;line-height:1.1;margin:var(--e2) 0 6px;position:relative;max-width:80%}
.cupon .cabeza p{font-size:12px;opacity:.86;line-height:1.5;position:relative;max-width:88%}
.cupon .cuerpo{padding:var(--e4);display:flex;flex-direction:column;gap:var(--e3);flex:1}
.cupon .dato{display:flex;justify-content:space-between;font-size:12.5px}
.cupon .barra{height:6px;border-radius:3px;background:var(--crema);overflow:hidden}
.cupon .barra i{display:block;height:100%;background:var(--naranja);border-radius:3px}

/* ---------- Ventas ---------- */
.fichas{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:var(--e4);margin-bottom:var(--e6)}
.ficha{background:#fff;border-radius:var(--r4);padding:var(--e5);box-shadow:var(--s-suave)}
.ficha .n{font-family:var(--display);font-size:38px;line-height:1;margin:var(--e2) 0 4px}
.barras{background:#fff;border-radius:var(--r4);padding:var(--e5);box-shadow:var(--s-suave)}
.barra-fila{display:flex;align-items:center;gap:var(--e3);margin-bottom:var(--e3)}
.barra-fila .et{width:170px;flex:none;font-size:13px;font-weight:500}
.barra-fila .pista{flex:1;height:26px;background:var(--crema);border-radius:var(--r2);overflow:hidden}
.barra-fila .pista i{display:block;height:100%;background:linear-gradient(90deg,#F9C65C,#F26B1F);border-radius:var(--r2);
  transition:width .8s cubic-bezier(.3,.9,.3,1)}
.barra-fila .v{width:74px;text-align:right;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- Modal ---------- */
.telon{position:fixed;inset:0;background:rgba(31,31,31,.5);backdrop-filter:blur(3px);z-index:100;
  display:grid;place-items:center;padding:var(--e5);opacity:0;pointer-events:none;transition:.2s}
.telon.ver{opacity:1;pointer-events:auto}
.modal{background:var(--marfil);border-radius:var(--r4);width:min(520px,100%);max-height:88vh;overflow-y:auto;
  padding:var(--e6);box-shadow:var(--s-fuerte);transform:translateY(14px);transition:.24s cubic-bezier(.2,.9,.3,1)}
.telon.ver .modal{transform:none}
.campo{margin-bottom:var(--e4)}
.campo label{display:block;font-size:12px;font-weight:600;margin-bottom:6px}
.campo input,.campo select,.campo textarea{width:100%;height:44px;padding:0 var(--e3);border:1.5px solid var(--linea);
  border-radius:var(--r3);background:#fff;font-size:14px}
.campo textarea{height:80px;padding:var(--e3);resize:vertical;line-height:1.5}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:0;border-color:var(--naranja);
  box-shadow:0 0 0 3px rgba(242,107,31,.12)}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:var(--e3)}

/* ---------- Aviso ---------- */
.aviso{position:fixed;right:var(--e5);bottom:var(--e5);z-index:120;background:var(--carbon);color:var(--marfil);
  border-radius:var(--r3);padding:var(--e3) var(--e4);font-size:13.5px;font-weight:500;box-shadow:var(--s-fuerte);
  display:flex;align-items:center;gap:var(--e3);opacity:0;transform:translateY(14px);
  pointer-events:none;transition:.26s cubic-bezier(.2,.9,.3,1)}
.aviso.ver{opacity:1;transform:none}

.sube{animation:sube .42s cubic-bezier(.2,.85,.3,1) both}
@keyframes sube{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

@media (max-width:1180px){ .carriles{grid-template-columns:repeat(2,1fr)} }
@media (max-width:820px){
  body{flex-direction:column;overflow:auto;height:auto}
  .lateral{width:100%;flex-direction:row;align-items:center;padding:var(--e3) var(--e4);gap:var(--e4);overflow-x:auto}
  .lateral .marca{padding:0}
  .nav{flex-direction:row}
  .lateral .pie{margin:0;padding:0;border:0;display:flex;gap:var(--e2)}
  .encabezado,.contenido{padding-left:var(--e4);padding-right:var(--e4)}
  .carriles{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

const SUPABASE = {

/**
 * Sesión del personal.
 *
 * La seguridad por fila de la base solo deja mover pedidos a quien tenga rol
 * cocina, caja o admin. Por eso el panel inicia sesión con una cuenta del
 * equipo y usa SU token en cada llamada. La llave de servicio NO se pone
 * aquí: este archivo se sirve al navegador y esa llave se salta todas las
 * reglas de seguridad de la base.
 */
let SESION = null;

function cabecerasApi(json = false) {
  const h = {
    apikey: SUPABASE.anon,
    Authorization: `Bearer ${SESION?.access_token || SUPABASE.anon}`,
  };
  if (json) { h['Content-Type'] = 'application/json'; h.Prefer = 'return=minimal'; }
  return h;
}

async function entrarComoStaff(correo, clave) {
  const r = await fetch(`${SUPABASE.url}/auth/v1/token?grant_type=password`, {
    method: 'POST',
    headers: { apikey: SUPABASE.anon, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: correo, password: clave }),
  }).catch(() => null);

  if (!r || !r.ok) return { ok: false, mensaje: 'Correo o contraseña incorrectos.' };

  SESION = await r.json();
  try { sessionStorage.setItem('lamesa_sesion', JSON.stringify(SESION)); } catch {}
  return { ok: true };
}

function recuperarSesion() {
  try {
    const guardada = sessionStorage.getItem('lamesa_sesion');
    if (guardada) SESION = JSON.parse(guardada);
  } catch {}
}

/* El token de acceso dura ~1 hora. Sin esto, pasada esa hora cada llamada a
   la base empieza a fallar en silencio y el tablero se queda pegado en lo
   último que alcanzó a cargar, sin avisarle a cocina que tiene que volver
   a entrar. asegurarSesion() se corre cada minuto (ver el reloj más abajo)
   y renueva el token con el refresh_token ANTES de que venza; solo si esa
   renovación falla mandamos a la persona de vuelta a la pantalla de login. */
function sesionVencePronto(margenSeg = 120) {
  if (!SESION?.expires_at) return false;
  return (SESION.expires_at * 1000) < (Date.now() + margenSeg * 1000);
}

async function refrescarSesion() {
  if (!SESION?.refresh_token) return false;
  const r = await fetch(`${SUPABASE.url}/auth/v1/token?grant_type=refresh_token`, {
    method: 'POST',
    headers: { apikey: SUPABASE.anon, 'Content-Type': 'application/json' },
    body: JSON.stringify({ refresh_token: SESION.refresh_token }),
  }).catch(() => null);
  if (!r || !r.ok) return false;
  SESION = await r.json();
  try { sessionStorage.setItem('lamesa_sesion', JSON.stringify(SESION)); } catch {}
  if (CLIENTE_RT && SESION?.access_token) CLIENTE_RT.realtime.setAuth(SESION.access_token);
  return true;
}

async function asegurarSesion() {
  if (!EN_VIVO || !SESION) return;
  if (!sesionVencePronto()) return;
  const ok = await refrescarSesion();
  if (!ok) {
    SESION = null;
    try { sessionStorage.removeItem('lamesa_sesion'); } catch {}
    avisar('Tu sesión venció. Vuelve a entrar para seguir viendo los pedidos.');
    pintar();
  }
}

/* =====================================================================
   Aviso sonoro: dos notas cortas, generadas en el navegador.
   Sin archivos externos, así el panel funciona aunque no haya internet.
   ===================================================================== */
let audio;
function campana(){
  if (!S.sonido) return;
  try{
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
    [[880, 0], [1320, .14]].forEach(([hz, t]) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = 'sine'; o.frequency.value = hz;
      g.gain.setValueAtTime(0, audio.currentTime + t);
      g.gain.linearRampToValueAtTime(.22, audio.currentTime + t + .02);
      g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + t + .38);
      o.connect(g); g.connect(audio.destination);
      o.start(audio.currentTime + t); o.stop(audio.currentTime + t + .4);
    });
  }catch(e){ /* si el navegador bloquea el audio, el tablero igual avisa en pantalla */ }
}

function avisar(txt){

/* Un toque mueve el pedido al siguiente estado. En vivo esto escribe en
   Supabase y el cliente ve el cambio en su teléfono en menos de 5 segundos. */
function avanzar(num){
  const p = PEDIDOS.find(x => x.num === num);
  const sig = siguientePaso(p);
  if (!sig) return;
  p.estado = sig.estado;
  S.nuevos.delete(num);
  const rotulo = {
    en_preparacion:'está en preparación',
    listo:'está listo',
    en_camino:'va en camino',
    entregado:'quedó entregado',
  };
  avisar(`Pedido #${num} ${rotulo[p.estado]}. El cliente ya lo ve en su app.`);
  if (EN_VIVO) guardarEstado(num, p.estado);
  pintar();
}

function pedidoDePrueba(){
  const num = Math.max(...PEDIDOS.map(p => p.num)) + 1;
  const disponibles = MENU.filter(m => m.disp);
  const cuantos = 1 + Math.floor(Math.random() * 2);
  const items = [];
  for (let i = 0; i < cuantos; i++){
    const m = disponibles[Math.floor(Math.random() * disponibles.length)];
    if (!items.some(x => x.n === m.n)) items.push({q: 1 + Math.floor(Math.random() * 2), n: m.n});
  }
  const modo = Math.random() > .45 ? 'domicilio' : 'recoger';
  const pago = PAGOS[Math.floor(Math.random() * PAGOS.length)];
  PEDIDOS.unshift({
    num, quien: NOMBRES[Math.floor(Math.random() * NOMBRES.length)], modo,
    estado:'recibido', min:0, pago, pagado: pago !== 'Efectivo', items,
    nota: Math.random() > .7 ? 'Para llevar, por favor.' : null,
  });
  S.nuevos.add(num);
  campana();
  if (S.vista !== 'pedidos') S.vista = 'pedidos';
  avisar(`Pedido nuevo #${num} · ${modo === 'recoger' ? 'recoge en tienda' : 'domicilio'}`);
  pintar();
}

function alternarPlato(id){
  const p = MENU.find(x => x.id === id);
  p.disp = !p.disp;
  avisar(p.disp ? `${p.n} vuelve al menú` : `${p.n} se marcó como agotado y desapareció de la app`);
  if (EN_VIVO) guardarPlato(p);
  pintar();
}

function editar(id, campo, valor){
  const p = MENU.find(x => x.id === id);
  p[campo] = valor;
  avisar(campo === 'p' ? `${p.n} ahora cuesta ${cop(valor)}` : `${p.n} actualizado`);
  if (EN_VIVO) guardarPlato(p);
  if (campo === 'p') pintar();
}

async function borrarPlato(id){
  const p = MENU.find(x => x.id === id);
  if (!confirm(`¿Quitar "${p.n}" del menú? Los pedidos que ya lo incluyen no se ven afectados.`)) return;

  if (EN_VIVO){
    const r = await fetch(`${SUPABASE.url}/rest/v1/productos?id=eq.${p.id}`, {
      method:'DELETE', headers: cabecerasApi(true),
    }).catch(() => null);
    if (!r || !r.ok){
      // La base protege pedido_items con RESTRICT: si el plato ya salió en
      // algún pedido, borrarlo de verdad rompería ese historial. Se marca
      // agotado en su lugar, que es lo que la app necesita de todas formas.
      return avisar(r && r.status === 409
        ? `"${p.n}" ya está en pedidos anteriores y no se puede borrar. Márcalo como agotado en su lugar.`
        : 'No se pudo borrar el plato. Revisa la conexión.');
    }
  }
  MENU = MENU.filter(x => x.id !== id);
  avisar(`${p.n} salió del menú`);
  pintar();
}

function alternarCupon(id){
  const c = CUPONES.find(x => x.id === id);
  c.activo = !c.activo;
  avisar(c.activo ? `${c.t} está activa en la app` : `${c.t} quedó pausada`);
  pintar();
}

function alternarTienda(){
  S.abierto = !S.abierto;
  document.getElementById('palancaTienda').classList.toggle('on', S.abierto);
  document.getElementById('estadoTienda').textContent = S.abierto ? 'Abierto' : 'Cerrado';
  avisar(S.abierto ? 'La tienda quedó abierta' : 'Tienda cerrada: la app deja programar pedidos para mañana');

function alternarSonido(){

  if (S.sonido) campana();
  pintar();
}

async function guardarProducto(){

/* =====================================================================
   Foto del plato
   ---------------------------------------------------------------------
   La foto se encuadra aquí y no en la app: el mismo recorte alimenta la
   tarjeta grande del menú y la miniatura del carrito, así que lo que se
   ve en esta ventana es exactamente lo que va a ver el cliente.
   ===================================================================== */
const FOTO_BASE = {x:50, y:50, z:1};

function editorFoto(id){
  abrirModal('<div id="cuerpoFoto"></div>');
  pintarEditorFoto(id);
}

function pintarEditorFoto(id){
  const p = MENU.find(x => x.id === id);
  const f = p.img;
  const est = f ? `object-position:${f.x}% ${f.y}%;transform:scale(${f.z})` : '';
  document.getElementById('cuerpoFoto').innerHTML = `
    <div style="display:flex;align-items:center;margin-bottom:var(--e5)">
      <div>
        <div class="h2">Foto del plato</div>
        <div class="b2 muted" style="margin-top:2px">${p.n}</div>
      </div>
      <button class="btn btn-sm" style="margin-left:auto" onclick="cerrarModal()">${ico('i-cerrar',18)}</button>
    </div>

    ${f ? `
      <div class="cap faint" style="margin-bottom:var(--e2)">Así se ve en el menú de la app</div>
      <div class="marco marco-tarjeta" id="recorte">
        <img src="${f.url}" alt="" style="${est}">
        <span class="guia"></span>
      </div>
      <p class="b2 faint" style="margin:var(--e2) 0 var(--e5)">
        Arrastra la imagen para elegir qué parte del plato se ve.</p>

      <label class="b2" style="font-weight:600;display:block;margin-bottom:var(--e2)">Acercar</label>
      <input class="deslizador" type="range" min="1" max="2.5" step="0.01" value="${f.z}"
        oninput="zoomFoto('${id}', this.value)">

      <div style="display:flex;align-items:center;gap:var(--e4);margin:var(--e5) 0;
        background:#fff;border-radius:var(--r3);padding:var(--e3) var(--e4)">
        <div class="marco marco-chip"><img src="${f.url}" alt="" style="${est}"></div>
        <div class="marco marco-redondo"><img src="${f.url}" alt="" style="${est}"></div>
        <div class="b2 muted" style="flex:1">El mismo encuadre se usa en el carrito y en los momentos.</div>
      </div>

      <div style="display:flex;gap:var(--e2)">
        <button class="btn btn-primario" style="flex:1" onclick="guardarFoto('${id}')">Guardar foto</button>
        <button class="btn btn-secundario" onclick="elegirArchivo('${id}')">Cambiar</button>
        <button class="btn btn-linea" style="color:var(--rojo-texto);border-color:rgba(214,69,69,.3)"
          onclick="quitarFoto('${id}')">${ico('i-basura',17)}</button>
      </div>`
    : `
      <div class="soltar" id="zona" onclick="elegirArchivo('${id}')">
        <div class="aro"></div>
        <div class="h3" style="margin-bottom:6px">Arrastra la foto aquí</div>
        <p class="b2 muted">O toca para buscarla en tu computador.<br>
          JPG o PNG, mínimo 1200 px de ancho.</p>
        <span class="btn btn-secundario btn-sm" style="margin-top:var(--e4)">
          ${ico('i-subir',16)} Buscar foto</span>
      </div>
      <p class="b2 faint" style="margin-top:var(--e4);line-height:1.6">
        Fotografía cálida, cercana y natural, con el plato bien iluminado y sin filtros fuertes —
        el tono visual de la marca. Una foto horizontal funciona mejor que una vertical.</p>`}

    <input type="file" id="archivoFoto" accept="image/*" hidden onchange="tomarArchivo(event,'${id}')">`;

  if (f) prepararArrastre(id);
  else prepararSoltar(id);
}

function elegirArchivo(){ document.getElementById('archivoFoto').click(); }

function tomarArchivo(ev, id){
  const archivo = ev.target.files && ev.target.files[0];
  if (archivo) cargarFoto(archivo, id);
}

function cargarFoto(archivo, id){
  if (!archivo.type.startsWith('image/')) return avisar('Ese archivo no es una imagen');
  if (archivo.size > 8 * 1024 * 1024) return avisar('La foto pesa más de 8 MB. Usa una más liviana.');
  const lector = new FileReader();
  lector.onload = e => {
    const p = MENU.find(x => x.id === id);
    p.img = {...FOTO_BASE, url:e.target.result, archivo};
    pintarEditorFoto(id);
    avisar('Foto cargada. Encuádrala y guarda.');
  };
  lector.readAsDataURL(archivo);
}

function prepararSoltar(id){
  const z = document.getElementById('zona');
  if (!z) return;
  ['dragenter','dragover'].forEach(e => z.addEventListener(e, ev => {
    ev.preventDefault(); z.classList.add('encima');
  }));
  ['dragleave','drop'].forEach(e => z.addEventListener(e, ev => {
    ev.preventDefault(); z.classList.remove('encima');
  }));
  z.addEventListener('drop', ev => {
    const archivo = ev.dataTransfer.files && ev.dataTransfer.files[0];
    if (archivo) cargarFoto(archivo, id);
  });
}

/* Arrastrar para reencuadrar: mueve el punto focal, no la imagen entera */
function prepararArrastre(id){
  const marco = document.getElementById('recorte');
  if (!marco) return;
  const p = MENU.find(x => x.id === id);
  let activo = false, x0 = 0, y0 = 0, ix = 0, iy = 0;

  marco.addEventListener('pointerdown', e => {
    activo = true; x0 = e.clientX; y0 = e.clientY;
    ix = p.img.x; iy = p.img.y;
    marco.setPointerCapture(e.pointerId);
  });
  marco.addEventListener('pointermove', e => {
    if (!activo) return;
    const c = marco.getBoundingClientRect();
    p.img.x = Math.max(0, Math.min(100, ix - (e.clientX - x0) / c.width * 100));
    p.img.y = Math.max(0, Math.min(100, iy - (e.clientY - y0) / c.height * 100));
    document.querySelectorAll('#cuerpoFoto .marco img').forEach(img => {
      img.style.objectPosition = `${p.img.x}% ${p.img.y}%`;
    });
  });
  marco.addEventListener('pointerup', () => { activo = false; });
  marco.addEventListener('pointercancel', () => { activo = false; });
}

function zoomFoto(id, v){
  const p = MENU.find(x => x.id === id);
  p.img.z = +v;
  document.querySelectorAll('#cuerpoFoto .marco img').forEach(img => {
    img.style.transform = `scale(${p.img.z})`;
  });
}

function quitarFoto(id){
  const p = MENU.find(x => x.id === id);
  p.img = null;
  pintarEditorFoto(id);
  pintar();
  avisar(`${p.n} vuelve a mostrarse sin foto en la app`);
}

async function guardarFoto(id){
  const p = MENU.find(x => x.id === id);
  cerrarModal();
  pintar();
  if (EN_VIVO && p.img && p.img.archivo){
    avisar('Subiendo la foto…');
    const url = await subirImagen(p.img.archivo, p.id);
    if (url){ p.img.url = url; delete p.img.archivo; guardarPlato(p); avisar(`Foto de ${p.n} publicada en la app`); }
  } else {
    avisar(`Foto de ${p.n} guardada`);
  }
}

/* Supabase Storage: bucket público "productos". El encuadre viaja en la URL
   para que la app lo respete sin guardar columnas extra. */
async function subirImagen(archivo, idProducto){
  const ext = (archivo.name.split('.').pop() || 'jpg').toLowerCase();
  const ruta = `productos/${idProducto}-${Date.now()}.${ext}`;
  const r = await fetch(`${SUPABASE.url}/storage/v1/object/${ruta}`, {
    method:'POST',
    headers:{...cabecerasApi(), 'Content-Type':archivo.type},
    body: archivo,
  }).catch(() => null);
  if (!r || !r.ok){ avisar('No se pudo subir la foto. Revisa la conexión.'); return null; }
  return `${SUPABASE.url}/storage/v1/object/public/${ruta}`;
}

function formCupon(){
  abrirModal(`
    <div style="display:flex;align-items:center;margin-bottom:var(--e5)">
      <div class="h2">Nueva promo</div>
      <button class="btn btn-sm" style="margin-left:auto" onclick="cerrarModal()">${ico('i-cerrar',18)}</button>
    </div>
    <div class="campo"><label>Título</label><input id="cT" placeholder="Ej. Postre gratis los domingos"></div>
    <div class="campo"><label>Descripción</label>
      <textarea id="cD" placeholder="Lo que ve el cliente en la pestaña Promos."></textarea></div>
    <div class="dupla">
      <div class="campo"><label>Código</label><input id="cId" placeholder="POSTRE0" style="text-transform:uppercase"></div>
      <div class="campo"><label>Canjes máximos</label><input id="cM" type="number" placeholder="200"></div>
    </div>
    <div class="campo"><label>Vence</label><input id="cV" type="date"></div>
    <div style="display:flex;gap:var(--e2);margin-top:var(--e5)">
      <button class="btn btn-primario" style="flex:1" onclick="guardarCupon()">Publicar promo</button>
      <button class="btn btn-secundario" onclick="cerrarModal()">Cancelar</button>
    </div>`);
  setTimeout(() => document.getElementById('cT').focus(), 60);
}

function guardarCupon(){
  const t = document.getElementById('cT').value.trim();
  const id = document.getElementById('cId').value.trim().toUpperCase();
  if (!t || !id) return avisar('Falta el título o el código de la promo');
  CUPONES.unshift({
    id, t, d: document.getElementById('cD').value.trim() || 'Promoción exclusiva de la app.',
    activo:true, usos:0, max:+document.getElementById('cM').value || 100,
    vence: document.getElementById('cV').value || 'sin fecha límite',
  });
  cerrarModal(); avisar(`${t} ya se ve en la app`); pintar();
}

/* =====================================================================
   Supabase — se activa solo cuando hay credenciales arriba
   ===================================================================== */
async function guardarEstado(num, estado){
  await fetch(`${SUPABASE.url}/rest/v1/pedidos?numero=eq.${num}`, {
    method:'PATCH',
    headers: cabecerasApi(true),
    body: JSON.stringify({estado}),
  }).catch(() => avisar('No se pudo guardar el cambio. Revisa la conexión.'));
}

async function guardarPlato(p){
  const r = await fetch(`${SUPABASE.url}/rest/v1/productos?id=eq.${p.id}`, {
    method:'PATCH',
    headers: cabecerasApi(true),
    body: JSON.stringify({
      nombre:p.n, descripcion:p.d, precio:p.p, disponible:p.disp,
      categoria_id: categoriaId(p.cat), badges: badgeHaciaDb(p.badge),
    }),
  }).catch(() => null);
  if (!r || !r.ok) avisar('No se pudo guardar el plato. Revisa la conexión.');
}

/* Trae el menú real de Supabase y reemplaza los datos de muestra.
   Sin esto MENU se queda para siempre con la lista fija de aquí arriba,
   que es justo lo que pasaba antes: se veía bien porque los nombres
   coinciden con seed.sql, pero guardar fallaba porque los id (1, 2, 3…)
   no son los uuid reales de la tabla productos. */
async function cargarMenu(){
  if (!EN_VIVO) return;
  const [rCat, rProd] = await Promise.all([
    fetch(`${SUPABASE.url}/rest/v1/categorias?select=id,nombre&order=orden`, {headers: cabecerasApi()}),
    fetch(`${SUPABASE.url}/rest/v1/productos?select=id,categoria_id,nombre,descripcion,precio,imagen_url,badges,disponible&order=orden`, {headers: cabecerasApi()}),
  ]).catch(() => []);
  if (!rCat || !rProd || !rCat.ok || !rProd.ok) {
    return avisar('No se pudo cargar el menú desde la base. Revisa la conexión.');
  }
  const categorias = await rCat.json();
  CATEGORIAS = categorias.map(c => ({id: c.id, cat: c.nombre.toLowerCase()}));
  const catDe = id => (CATEGORIAS.find(c => c.id === id) || {}).cat || CAT[0];

  const productos = await rProd.json();
  MENU = productos.map(p => ({
    id: p.id,
    cat: catDe(p.categoria_id),
    n: p.nombre,
    d: p.descripcion || 'Sin descripción todavía.',
    p: Number(p.precio),
    badge: badgeDesdeDb(p.badges),
    disp: p.disponible,
    img: p.imagen_url ? FOTO(p.imagen_url) : null,
  }));
  if (S.vista === 'menu') pintar();
}

/* Realtime: cada pedido nuevo entra al tablero sin recargar nada.
   Requiere <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"> */
let CLIENTE_RT = null;
function escucharPedidos(){
  if (!EN_VIVO || !window.supabase) return;
  const sb = window.supabase.createClient(SUPABASE.url, SUPABASE.anon);
  CLIENTE_RT = sb;
  // Realtime abre su propio socket: hereda la URL y la clave anónima, pero
  // no el Bearer que usan las consultas REST. Sin este token, RLS no puede
  // reconocer al miembro de cocina y no le entrega cambios de pedidos.
  // asegurarSesion() vuelve a llamar CLIENTE_RT.realtime.setAuth(...) cada
  // vez que el token se renueva, para que este socket no se quede con uno vencido.
  if (SESION?.access_token) sb.realtime.setAuth(SESION.access_token);
  sb.channel('pedidos-sede')
    .on('postgres_changes',
        {event:'INSERT', schema:'public', table:'pedidos', filter:`sede_id=eq.${SUPABASE.sede}`},
        ({new: p}) => { S.nuevos.add(p.numero); campana(); cargarPedidos(); })
    .on('postgres_changes',
        {event:'UPDATE', schema:'public', table:'pedidos', filter:`sede_id=eq.${SUPABASE.sede}`},
        () => cargarPedidos())
    .subscribe();
}

async function cargarPedidos(){
  if (!EN_VIVO) return;
  const r = await fetch(
    `${SUPABASE.url}/rest/v1/pedidos?sede_id=eq.${SUPABASE.sede}&estado=neq.pendiente_pago` +
    `&select=numero,estado,modalidad,metodo_pago,estado_pago,total,notas,creado_en,` +
    `perfiles(nombre),pedido_items(cantidad,nombre,opciones)&order=creado_en.desc`,
    {headers: cabecerasApi()}
  ).then(x => x.json()).catch(() => null);
  if (!r) return;
  PEDIDOS = r.map(p => ({
    num:p.numero, quien:p.perfiles?.nombre || 'Cliente', modo:p.modalidad,
    estado:p.estado,
    min:Math.round((Date.now() - new Date(p.creado_en)) / 60000),
    pago:p.metodo_pago, pagado:p.estado_pago === 'aprobado', nota:p.notas,
    items:(p.pedido_items || []).map(i => ({q:i.cantidad, n:i.nombre,
      op:(i.opciones || []).map(o => o.opcion).join(' · ') || null})),
  }));
  pintar();
}

/* El reloj de cada pedido corre solo: es lo que le dice a cocina qué se está demorando.
   Aprovechamos el mismo minutero para revisar que la sesión siga viva. */
setInterval(() => {
  PEDIDOS.forEach(p => { if (p.estado !== 'entregado') p.min++; });
  if (S.vista === 'pedidos') pintar();
  asegurarSesion();
}, 60000);

/* En demostración entra un pedido de vez en cuando para que el tablero respire */
if (!EN_VIVO) setInterval(() => { if (Math.random() > .55) pedidoDePrueba(); }, 45000);

recuperarSesion();
asegurarSesion();
pintar();
if (!EN_VIVO || SESION){ escucharPedidos(); cargarPedidos(); cargarMenu(); }
</script>
