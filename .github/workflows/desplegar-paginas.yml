name: Desplegar en GitHub Pages

# Reemplaza el pipeline automático de Jekyll de GitHub Pages, que por
# defecto ignora cualquier carpeta que empiece con guion bajo (como
# _expo/, que genera Expo al exportar la app web) o que se llame
# node_modules/. Este workflow sube el sitio tal cual está, sin
# procesarlo con Jekyll, así que nada se excluye en silencio.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Subir el sitio como artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
